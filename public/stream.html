<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidFaction — Cockpit Amiral</title>
  <style>
    body { margin: 0; background: #04060a; font-family: 'Consolas', monospace; color: #fff; overflow: hidden; }
    #login {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.92); z-index: 100;
    }
    #login form {
      background: #0a1424; border: 1px solid #4af; padding: 24px 28px; border-radius: 6px;
      box-shadow: 0 0 32px rgba(74, 175, 255, 0.4); min-width: 280px;
    }
    #login h2 { margin: 0 0 12px 0; color: #4af; font-size: 16px; }
    #login p { margin: 8px 0; font-size: 13px; }
    #login input {
      background: #000; color: #fff; border: 1px solid #4af; padding: 8px 40px 8px 8px;
      font-family: monospace; width: 100%; box-sizing: border-box;
    }
    .pwd-wrap { position: relative; margin-bottom: 12px; }
    .pwd-toggle {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: transparent; border: 0; color: #4af; cursor: pointer;
      padding: 4px; display: flex; align-items: center; justify-content: center;
    }
    .pwd-toggle:hover { color: #6cf; }
    .pwd-toggle svg { display: block; width: 18px; height: 18px; }
    #login > form > button[type="submit"] {
      background: #4af; color: #000; border: 0; padding: 8px 16px;
      font-family: monospace; cursor: pointer; font-weight: bold;
    }
    #login > form > button[type="submit"]:hover { background: #6cf; }
    #loginError { color: #f44; min-height: 16px; font-size: 12px; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .line {
      background: rgba(0, 20, 40, 0.7); padding: 8px 12px; border: 1px solid #f84;
      border-radius: 4px; font-size: 14px; box-shadow: 0 0 12px rgba(255, 136, 68, 0.3);
    }
    .line strong { color: #f84; }
    .hidden { display: none !important; }
    /* Commandant */
    #captainAlert {
      position: fixed; bottom: 14px; left: 14px; z-index: 28;
      display: flex; align-items: flex-end; gap: 10px; pointer-events: none;
      animation: captainSlideIn 0.4s ease-out;
    }
    #captainAlert.hidden { display: none; }
    @keyframes captainSlideIn {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    #captainAlert .portrait {
      width: 140px; height: 130px;
      border: 2px solid #f84; border-radius: 6px;
      background: rgba(40, 10, 0, 0.85);
      box-shadow: 0 0 18px rgba(255, 136, 68, 0.55);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #captainAlert .portrait::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 3px);
      pointer-events: none; z-index: 2;
    }
    #captainAlert .portrait img { width: 100%; height: 100%; object-fit: contain; }
    #captainAlert .bubble {
      position: relative;
      background: rgba(40, 10, 0, 0.92);
      border: 2px solid #f84; border-radius: 6px;
      padding: 10px 14px; max-width: 320px; font-size: 13px; letter-spacing: 1px;
      color: #fff; box-shadow: 0 0 14px rgba(255, 136, 68, 0.4); line-height: 1.4;
      font-family: 'Consolas', monospace;
    }
    #captainAlert .bubble::before {
      content: ''; position: absolute; left: -8px; top: 20px;
      width: 0; height: 0;
      border-top: 8px solid transparent; border-bottom: 8px solid transparent;
      border-right: 8px solid #f84;
    }
    #captainAlert .bubble .role {
      display: block; font-size: 10px; color: #f84; opacity: 0.9; margin-bottom: 3px;
      text-transform: uppercase; letter-spacing: 2px;
    }
    #captainAlert .bubble .msg { color: #fff; font-weight: bold; }
    #captainAlert .bubble .msg .danger { color: #ff7a7a; }
    #waveBanner {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 30;
      padding: 10px 22px; border-radius: 4px;
      font-weight: bold; font-size: 14px; letter-spacing: 3px;
      pointer-events: none;
      display: flex; align-items: center; gap: 12px;
      font-family: 'Consolas', monospace;
    }
    #waveBanner.hidden { display: none; }
    #waveBanner.warning {
      background: rgba(60, 0, 0, 0.85);
      border: 1px solid #f55;
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 60, 60, 0.7);
      animation: warnPulse 1.1s ease-in-out infinite;
    }
    #waveBanner.active {
      background: rgba(50, 0, 0, 0.65);
      border: 1px solid #f88;
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 120, 120, 0.4);
    }
    #waveBanner .target { color: #ff9999; }
    #waveBanner .countdown { color: #fff; font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
    @keyframes warnPulse {
      0%, 100% { box-shadow: 0 0 14px rgba(255, 60, 60, 0.5); }
      50%      { box-shadow: 0 0 26px rgba(255, 60, 60, 0.95); }
    }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm">
      <h2>&gt; ACCÈS AMIRAL</h2>
      <p>Mot de passe Amiral :</p>
      <div class="pwd-wrap">
        <input type="password" id="password" autocomplete="off" autofocus />
        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Afficher le mot de passe" title="Afficher / masquer">
          <svg id="pwdEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="eye-open">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </g>
            <g class="eye-closed" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </g>
          </svg>
        </button>
      </div>
      <button type="submit">Connexion</button>
      <p id="loginError"></p>
    </form>
  </div>
  <div id="hud" class="hidden">
    <div class="line">Ressource de faction : <strong id="resource">0</strong></div>
    <div class="line">Clic droit — déplacer le vaisseau &nbsp;|&nbsp; Molette — zoom</div>
  </div>
  <div id="waveBanner" class="hidden">
    <span>⚠ VAGUE EN APPROCHE — CIBLE</span>
    <span class="target"></span>
    <span class="countdown"></span>
  </div>

  <div id="captainAlert" class="hidden">
    <div class="portrait"><img id="captainImg" alt="Commandant" /></div>
    <div class="bubble">
      <span class="role">COMMANDANT</span>
      <span class="msg" id="captainMsg"></span>
    </div>
  </div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/streamer.js"></script>
</body>
</html>
