<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidFaction — Cockpit Streameur</title>
  <style>
    body { margin: 0; background: #04060a; font-family: 'Consolas', monospace; color: #fff; overflow: hidden; }
    #login {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.92); z-index: 100;
    }
    #login form {
      background: #0a1424; border: 1px solid #4af; padding: 24px 28px; border-radius: 6px;
      box-shadow: 0 0 32px rgba(74, 175, 255, 0.4); min-width: 280px;
    }
    #login h2 { margin: 0 0 12px 0; color: #4af; font-size: 16px; }
    #login p { margin: 8px 0; font-size: 13px; }
    #login input {
      background: #000; color: #fff; border: 1px solid #4af; padding: 8px 40px 8px 8px;
      font-family: monospace; width: 100%; box-sizing: border-box;
    }
    .pwd-wrap { position: relative; margin-bottom: 12px; }
    .pwd-toggle {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: transparent; border: 0; color: #4af; cursor: pointer;
      padding: 4px; display: flex; align-items: center; justify-content: center;
    }
    .pwd-toggle:hover { color: #6cf; }
    .pwd-toggle svg { display: block; width: 18px; height: 18px; }
    #login > form > button[type="submit"] {
      background: #4af; color: #000; border: 0; padding: 8px 16px;
      font-family: monospace; cursor: pointer; font-weight: bold;
    }
    #login > form > button[type="submit"]:hover { background: #6cf; }
    #loginError { color: #f44; min-height: 16px; font-size: 12px; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .line {
      background: rgba(0, 20, 40, 0.7); padding: 8px 12px; border: 1px solid #f84;
      border-radius: 4px; font-size: 14px; box-shadow: 0 0 12px rgba(255, 136, 68, 0.3);
    }
    .line strong { color: #f84; }
    .hidden { display: none !important; }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm">
      <h2>&gt; ACCÈS COCKPIT</h2>
      <p>Mot de passe streameur :</p>
      <div class="pwd-wrap">
        <input type="password" id="password" autocomplete="off" autofocus />
        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Afficher le mot de passe" title="Afficher / masquer">
          <svg id="pwdEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit">Connexion</button>
      <p id="loginError"></p>
    </form>
  </div>
  <div id="hud" class="hidden">
    <div class="line">Ressource de faction : <strong id="resource">0</strong></div>
    <div class="line">ZQSD — déplacement &nbsp;|&nbsp; Souris — visée</div>
  </div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/streamer.js"></script>
</body>
</html>
